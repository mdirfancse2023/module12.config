spring:
  application:
    name: module4.homework

  datasource:
    url: jdbc:postgresql://localhost:5434/vectordb
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

server:
  port: 8085

logging:
  level:
    root: INFO
    com.example.currency: DEBUG # Fixed indentation/formatting
  file:
    name: application.log

management:
  endpoints:
    web:
      exposure:
        include: "*" # FIXED: Added quotes around the asterisk

springdoc:
  swagger-ui:
    path: /swagger-ui.html
